[workspace]
resolver = "2"
members = [
    "crates/openforge-core",
    "crates/openforge-io",
    "crates/openforge-ops",
    "crates/openforge-materials",
    "crates/openforge-render",
    "crates/openforge-animation",
    "crates/openforge-algorithms",
    "crates/openforge-uv",
    "crates/openforge-boolean",
    "crates/openforge-rig",
    "crates/openforge-plugin",
    "crates/openforge-project",
    "crates/openforge-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/openforge"
authors = ["OpenForge contributors"]
description = "A clean-room, cross-platform open-source 3D modeling application."

[workspace.dependencies]
glam = "0.29"
# GPU viewport. Kept in the workspace so eframe (which re-exports the same
# wgpu) and openforge-render always resolve to one wgpu instance; mismatching
# versions would make their `wgpu` types incompatible.
wgpu = "22"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
