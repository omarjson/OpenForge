name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit + integration tests on all three desktop OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  # Type-check the portable crates for every target from one host.
  cross-check:
    name: cross-check portable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check Windows
        run: cargo check -p openforge-core -p openforge-io -p openforge-project --target x86_64-pc-windows-msvc
      - name: Check Linux
        run: cargo check -p openforge-core -p openforge-io -p openforge-project --target x86_64-unknown-linux-gnu
      - name: Check macOS
        run: cargo check -p openforge-core -p openforge-io -p openforge-project --target x86_64-apple-darwin

  # Full release build of the app on each OS.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p openforge-app
